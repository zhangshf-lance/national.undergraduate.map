<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>全国大学本科地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --topbar-height: 64px; --content-gap: 8px; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #1f2937; background: #f3f4f6; font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: relative; width: 100vw; height: 100vh; }
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    min-height: 64px; padding: 8px 16px; display: grid; grid-template-columns: minmax(210px, 1fr) auto minmax(210px, 1fr); align-items: center; gap: 14px;
    background: rgba(255,255,255,.96); border-bottom: 1px solid rgba(0,0,0,.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 1px 8px rgba(0,0,0,.04);
  }
  .topbar-left { display: contents; }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 {
    margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .5px; white-space: nowrap;
    background: linear-gradient(135deg, #b91c1c 0%, #ea580c 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .brand span { color: #6b7280; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-controls { display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .select-field {
    display: grid; gap: 3px; min-width: 128px;
  }
  .select-field.region { min-width: 142px; }
  .select-field label {
    font-size: 12px; font-weight: 850; line-height: 1; letter-spacing: 0;
  }
  .select-field.region label { color: #1d4ed8; }
  .select-field.owner label { color: #b45309; }
  .select-field.tier label { color: #be123c; }
  .top-select {
    height: 38px; min-width: 0; border: 2px solid #e5e7eb; border-radius: 8px;
    background: #fff; color: #1f2937; font: inherit; font-size: 15px; font-weight: 800;
    padding: 0 28px 0 9px; outline: none; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .select-field.region .top-select { border-color: #bfdbfe; background: #eff6ff; color: #1e40af; }
  .select-field.owner .top-select { border-color: #fed7aa; background: #fff7ed; color: #9a3412; }
  .select-field.tier .top-select { border-color: #fecdd3; background: #fff1f2; color: #9f1239; }
  .top-select:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
  .top-select option:disabled { color: #9ca3af; }
  .stats { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .stat {
    min-width: 76px; height: 36px; padding: 5px 10px; border-radius: 8px;
    background: #f3f4f6; border: 1px solid #e5e7eb;
  }
  .stat b { display: block; font-size: 15px; color: #b91c1c; line-height: 15px; }
  .stat small { display: block; color: #6b7280; font-size: 11px; line-height: 14px; margin-top: 2px; }
  #map { position: absolute; top: var(--topbar-height); left: 0; right: 0; bottom: 0; background: #e8e6df; }
  .leaflet-container { font-family: inherit; background: #e8e6df; }
  .school-dot {
    width: 26px; height: 26px; border-radius: 50% 50% 50% 0; border: 2.5px solid #fff;
    background: #3b82f6; box-shadow: 0 2px 6px rgba(0,0,0,.25);
    transform: rotate(-45deg); transition: transform .15s, box-shadow .15s;
  }
  .school-dot:hover { transform: rotate(-45deg) scale(1.14); box-shadow: 0 4px 14px rgba(0,0,0,.24); }
  .school-dot.private { background: #ea580c; }
  .school-dot.central { background: #2563eb; }
  .school-dot.coop { background: #7c3aed; }
  .school-dot.rank211 {
    width: 30px; height: 30px; background: #10b981;
    box-shadow: 0 3px 10px rgba(16,185,129,.34);
  }
  .school-dot.rank985 {
    width: 34px; height: 34px; background: #ea580c; border-width: 3px;
    box-shadow: 0 4px 15px rgba(234,88,12,.38);
  }
  .school-dot.conf-low { background: #9ca3af; border-style: dashed; opacity: .78; }
  .school-dot.conf-medium { box-shadow: 0 0 0 4px rgba(245,158,11,.18), 0 2px 7px rgba(0,0,0,.24); }
  .province-pin {
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 13px;
    border: 2.5px solid rgba(255,255,255,.9); background: #3b82f6;
    box-shadow: 0 4px 18px rgba(0,0,0,.2);
  }
  .panel {
    position: absolute; z-index: 850; top: calc(var(--topbar-height) + var(--content-gap)); bottom: auto; max-height: calc(100vh - var(--topbar-height) - 32px);
    background: rgba(255,255,255,.98); border: 1px solid rgba(0,0,0,.04);
    box-shadow: 0 4px 24px rgba(0,0,0,.1);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform .18s ease, opacity .18s ease;
  }
  .province-panel { left: 12px; width: 240px; border-radius: 12px; }
  .school-panel { right: 12px; width: 340px; border-radius: 12px; }
  .province-panel, .school-panel, .panel-toggle { display: none; }
  .province-panel.collapsed { transform: translateX(calc(-100% - 24px)); opacity: 0; pointer-events: none; }
  .school-panel.collapsed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
  .panel-head { padding: 14px 16px 10px; border-bottom: 1px solid #f1f5f9; }
  .panel-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .panel-title b { font-size: 13px; font-weight: 600; color: #374151; letter-spacing: .3px; }
  .panel-title span { font-size: 11px; color: #9ca3af; }
  .search {
    width: 100%; height: 32px; border: 1px solid #e5e7eb; border-radius: 6px;
    padding: 0 10px; font: inherit; font-size: 12px; color: #1f2937; outline: none; background: #f3f4f6;
  }
  .search:focus { border-color: #3b82f6; background: #fff; }
  .filters { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px; margin-top: 8px; }
  .rank-filters { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .classify-tabs { grid-template-columns: repeat(4, minmax(0,1fr)); margin-top: 8px; }
  .filter-btn {
    height: 26px; border: 1px solid #e5e7eb; border-radius: 6px; background: #f3f4f6;
    color: #6b7280; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all .12s;
  }
  .filter-btn:hover { background: #e5e7eb; }
  .filter-btn.active { color: #fff; background: #3b82f6; border-color: #3b82f6; }
  .list { overflow: auto; flex: 1; padding: 6px 0; }
  .province-item, .city-item, .school-item {
    border: 0; width: 100%; text-align: left; background: transparent; font: inherit; color: inherit;
    cursor: pointer; transition: background .14s, border-color .14s;
  }
  .province-item { padding: 9px 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px; border-left: 3px solid transparent; }
  .province-item:hover, .city-item:hover, .school-item:hover { background: #f9fafb; }
  .province-item.active { background: #eff6ff; border-left-color: #3b82f6; }
  .province-name { font-weight: 650; color: #374151; }
  .province-meta { grid-column: 1 / 3; color: #9ca3af; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .city-list { padding: 2px 0 6px; border-left: 3px solid transparent; }
  .city-list.collapsed { display: none; }
  .city-item {
    display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center;
    padding: 6px 16px 6px 30px; color: #6b7280; font-size: 12px;
  }
  .city-item.active { background: #fff7ed; color: #9a3412; font-weight: 650; }
  .city-count {
    min-width: 28px; height: 19px; padding: 0 7px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: #f3f4f6; color: #6b7280; font-size: 11px; font-weight: 700;
  }
  .city-item.active .city-count { background: #fed7aa; color: #9a3412; }
  .count-pill {
    align-self: start; min-width: 34px; height: 22px; padding: 0 8px; border-radius: 999px;
    background: #dbeafe; color: #1d4ed8; display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .school-item { padding: 10px 16px; border-left: 3px solid transparent; display: block; }
  .school-item.active { background: #fff7ed; border-left-color: #ea580c; }
  .group-heading {
    position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between;
    padding: 7px 16px; background: rgba(249,250,251,.96); border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9;
    color: #374151; font-size: 12px; font-weight: 700; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .group-heading span:last-child { color: #9ca3af; font-weight: 600; }
  .school-name { display: flex; gap: 7px; align-items: center; font-weight: 650; color: #374151; }
  .dot-key { width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; flex: 0 0 auto; }
  .dot-key.private { background: #ea580c; }
  .dot-key.central { background: #2563eb; }
  .dot-key.coop { background: #7c3aed; }
  .dot-key.rank211 { background: #10b981; box-shadow: 0 0 0 2px rgba(16,185,129,.14); }
  .dot-key.rank985 { background: #ea580c; border-radius: 2px; transform: rotate(45deg); box-shadow: 0 0 0 2px rgba(234,88,12,.14); }
  .dot-key.conf-low { background: #94a3b8; outline: 1px dashed #64748b; outline-offset: 2px; }
  .school-badges { display: inline-flex; gap: 4px; margin-left: auto; flex: 0 0 auto; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center; height: 18px; min-width: 31px;
    padding: 0 6px; border-radius: 999px; font-size: 10px; line-height: 18px; font-weight: 800;
    color: #fff; background: #10b981;
  }
  .badge.rank985 { background: #ea580c; }
  .school-meta { margin-top: 4px; color: #9ca3af; font-size: 12px; line-height: 1.45; }
  .detail {
    border-top: 1px solid #f1f5f9; padding: 12px 16px 14px; background: #fbfdff;
    min-height: 132px;
  }
  .detail h2 { margin: 0 0 6px; font-size: 15px; color: #1f2937; }
  .detail p { margin: 5px 0; color: #6b7280; font-size: 12px; line-height: 1.45; }
  .major-block { margin-top: 10px; border-top: 1px solid #e5e7eb; padding-top: 10px; }
  .major-block h3 { margin: 0 0 8px; font-size: 13px; color: #1f2937; }
  .major-list { display: grid; gap: 6px; max-height: 188px; overflow: auto; padding-right: 2px; }
  .major-row {
    display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 8px; align-items: center;
    padding: 7px 8px; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff;
  }
  .major-index {
    min-width: 22px; height: 20px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: #f3f4f6; color: #6b7280; font-size: 11px; font-weight: 800;
  }
  .major-name { min-width: 0; font-size: 12px; font-weight: 650; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .major-rank {
    min-width: 38px; height: 20px; padding: 0 7px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
    background: #eff6ff; color: #1d4ed8; font-size: 11px; font-weight: 800;
  }
  .major-source { grid-column: 2 / 4; color: #9ca3af; font-size: 11px; line-height: 1.35; }
  .legend {
    position: absolute; left: 16px; bottom: 18px; z-index: 840; display: flex; gap: 8px; flex-wrap: wrap;
    padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.96);
    border: 1px solid #e5e7eb; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: #6b7280; font-size: 12px; }
  .selection-chip {
    position: absolute; top: calc(var(--topbar-height) + var(--content-gap)); left: 50%; transform: translateX(-50%);
    z-index: 940; display: none !important; align-items: center; gap: 10px;
    max-width: min(560px, calc(100vw - 28px)); min-height: 44px; padding: 5px 6px 5px 14px;
    border: 1px solid rgba(234,88,12,.28); border-radius: 10px; background: rgba(255,255,255,.98);
    box-shadow: 0 10px 30px rgba(124,45,18,.18);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .selection-chip.active { display: inline-flex; }
  .selection-chip span {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 6px 9px; border-radius: 8px; background: #eff6ff; border: 1px solid #bfdbfe; border-left: 4px solid #2563eb;
    color: #1e40af; font-size: 15px; font-weight: 800;
  }
  .selection-chip button {
    height: 30px; padding: 0 10px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff;
    color: #ea580c; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer;
  }
  .selection-chip button:hover { background: #fff7ed; }
  .panel-toggle {
    position: absolute; top: calc(var(--topbar-height) + var(--content-gap)); z-index: 790;
    height: 34px; padding: 0 10px; border: 1px solid #e5e7eb; border-radius: 8px;
    background: rgba(255,255,255,.96); box-shadow: 0 2px 10px rgba(0,0,0,.08);
    color: #374151; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .panel-toggle:hover, .panel-toggle.active { background: #f9fafb; color: #b91c1c; }
  #province-panel-toggle { left: 12px; }
  #school-panel-toggle { right: 12px; }
  .notice {
    position: absolute; left: 16px; top: calc(var(--topbar-height) + 12px); z-index: 840; max-width: 520px;
    padding: 8px 10px; border-radius: 8px; background: rgba(255,251,235,.96); color: #92400e;
    border: 1px solid #fde68a; font-size: 12px; line-height: 1.45;
  }
  .summary-panel {
    position: absolute; right: 16px; top: calc(var(--topbar-height) + 12px); z-index: 845;
    width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - var(--topbar-height) - 52px); overflow: auto;
    padding: 12px; border-radius: 10px; background: rgba(255,255,255,.97);
    border: 1px solid rgba(15,23,42,.08); box-shadow: 0 8px 24px rgba(15,23,42,.12);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .summary-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .summary-title b { color: #111827; font-size: 15px; font-weight: 850; }
  .summary-title span { color: #b91c1c; font-size: 20px; font-weight: 900; }
  .summary-title-main { display: inline-flex; align-items: baseline; gap: 7px; min-width: 0; }
  .summary-clear {
    flex: 0 0 auto; height: 28px; padding: 0 9px;
    border: 1px solid #e5e7eb; border-radius: 7px;
    background: #fff; color: #4b5563; font: inherit; font-size: 12px; font-weight: 800;
    cursor: pointer; transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .summary-clear:hover { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }
  .summary-filter { margin-bottom: 9px; color: #6b7280; font-size: 12px; line-height: 1.45; }
  .summary-grid { display: grid; gap: 8px; }
  .summary-block { padding: 8px; border-radius: 8px; background: #f9fafb; border: 1px solid #e5e7eb; }
  .summary-block h3 { margin: 0 0 6px; color: #374151; font-size: 12px; font-weight: 850; }
  .summary-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .summary-tag {
    display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 3px 7px;
    border-radius: 999px; background: #fff; border: 1px solid #e5e7eb; color: #374151;
    font-size: 12px; font-weight: 700;
  }
  .summary-tag.filterable { cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .summary-tag.filterable:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(15,23,42,.10); }
  .summary-tag.active { box-shadow: 0 0 0 2px rgba(234,88,12,.16); border-color: #ea580c; }
  .summary-tag b { color: #111827; font-weight: 900; }
  .summary-tag.owner { border-color: #fed7aa; background: #fff7ed; color: #9a3412; }
  .summary-tag.tier { border-color: #fecdd3; background: #fff1f2; color: #9f1239; }
  .leaflet-popup-content { margin: 10px 12px; min-width: 190px; }
  .leaflet-control-zoom { border: none !important; box-shadow: 0 2px 10px rgba(0,0,0,.12) !important; }
  .leaflet-control-zoom a { border-color: #f1f5f9 !important; color: #374151 !important; }
  .leaflet-control-attribution { background: rgba(255,255,255,.76) !important; color: #6b7280 !important; }
  .popup-title { font-weight: 750; color: #1f2937; margin-bottom: 4px; }
  .popup-line { color: #6b7280; font-size: 12px; line-height: 1.45; }
  .popup-majors { margin-top: 7px; padding-top: 7px; border-top: 1px solid #e5e7eb; }
  .popup-major-title { color: #1f2937; font-size: 12px; font-weight: 750; margin-bottom: 5px; }
  .popup-major-tags { display: flex; flex-wrap: wrap; gap: 4px; max-width: 260px; }
  .popup-major-tag {
    display: inline-flex; align-items: center; max-width: 120px; height: 21px; padding: 0 7px;
    border-radius: 999px; background: #eff6ff; color: #1d4ed8; font-size: 11px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .popup-major-tag b { color: #be123c; margin-left: 4px; font-weight: 800; }
  .fallback-map {
    position: absolute; inset: 0; display: none; background:
      linear-gradient(rgba(59,130,246,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,.08) 1px, transparent 1px), #e8e6df;
    background-size: 42px 42px;
  }
  .fallback-map.active { display: block; }
  .fallback-point {
    position: absolute; transform: translate(-50%, -50%) rotate(-45deg);
    border-radius: 50% 50% 50% 0; border: 2.5px solid #fff;
    box-shadow: 0 2px 7px rgba(0,0,0,.25); cursor: pointer;
  }
  @media (max-width: 900px) {
    .topbar { align-items: flex-start; padding: 8px 10px; gap: 8px; flex-wrap: wrap; }
    .topbar { display: flex; }
    .topbar-left { display: grid; gap: 8px; width: 100%; }
    .brand { display: block; }
    .brand span { display: block; margin-top: 3px; max-width: calc(100vw - 24px); }
    .top-controls { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); width: 100%; }
    .select-field, .select-field.region { min-width: 0; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); width: 100%; gap: 6px; }
    .stat { min-width: 0; height: 34px; padding: 4px 7px; }
    .stat b { font-size: 14px; line-height: 14px; }
    .stat small { font-size: 10px; line-height: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stats .stat:nth-child(2) { display: none; }
    .province-panel { left: 8px; right: auto; width: calc(50vw - 12px); top: auto; bottom: 8px; height: calc(44vh - 14px); max-height: none; }
    .school-panel { right: 8px; width: calc(50vw - 12px); top: auto; bottom: 8px; height: calc(44vh - 14px); max-height: none; }
    .province-panel.collapsed, .school-panel.collapsed { transform: translateY(calc(100% + 18px)); opacity: 0; pointer-events: none; }
    .legend, .notice { display: none; }
    .summary-panel { right: 10px; left: 10px; width: auto; max-height: 28vh; }
    .detail { display: none; }
    .rank-filters { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .classify-tabs { grid-template-columns: repeat(4, minmax(0,1fr)); }
  }
  @media (max-width: 620px) {
    .topbar { padding: 7px 8px; gap: 7px; }
    .brand h1 { font-size: 15px; }
    .brand span { font-size: 11px; }
    .top-controls { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 7px; }
    .select-field { gap: 2px; }
    .select-field label { font-size: 11px; }
    .top-select { height: 34px; font-size: 13px; padding-left: 8px; padding-right: 24px; }
    .stats { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .stats .stat:first-child { display: none; }
    .stat { height: 32px; padding: 4px 6px; }
    .summary-panel { max-height: 30vh; }
    .province-panel { display: none; }
    .school-panel { left: 8px; right: 8px; width: auto; height: calc(44vh - 14px); }
    #province-panel-toggle { display: none; }
  }
  @media (max-width: 420px) {
    .top-controls { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .stats .stat:nth-child(3) { display: none; }
    .school-panel { height: calc(48vh - 14px); }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <h1>全国大学本科地图</h1>
        <span id="source-line">教育部全国普通高等学校名单</span>
      </div>
      <div class="top-controls" aria-label="分类筛选">
        <div class="select-field region">
          <label for="province-select">省份</label>
          <select id="province-select" class="top-select"></select>
        </div>
        <div class="select-field region">
          <label for="city-select">城市</label>
          <select id="city-select" class="top-select"></select>
        </div>
        <div class="select-field owner">
          <label for="owner-select">办学性质</label>
          <select id="owner-select" class="top-select"></select>
        </div>
        <div class="select-field tier">
          <label for="tier-select">学校层次</label>
          <select id="tier-select" class="top-select"></select>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="total-count">0</b><small>本科院校</small></div>
      <div class="stat"><b id="province-count">0</b><small>省级地区</small></div>
      <div class="stat"><b id="visible-count">0</b><small>当前显示</small></div>
      <div class="stat" title="线上由访问统计服务累计，离线时显示本机访问用户"><b id="busuanzi_value_site_uv">...</b><small>访问用户</small></div>
    </div>
  </header>
  <div id="map"><div id="fallback-map" class="fallback-map"></div></div>
  <div id="selection-chip" class="selection-chip"><span id="selection-name"></span><button id="clear-selection" type="button">清除选择</button></div>
  <button id="province-panel-toggle" class="panel-toggle" type="button">省市</button>
  <button id="school-panel-toggle" class="panel-toggle" type="button">学校</button>
  <aside class="panel province-panel">
    <div class="panel-head">
      <div class="panel-title"><b>省市筛选</b><span>点击聚焦</span></div>
      <input id="province-search" class="search" placeholder="搜索省份或城市" />
    </div>
    <div id="province-list" class="list"></div>
  </aside>
  <aside class="panel school-panel">
    <div class="panel-head">
      <div class="panel-title"><b>本科院校</b><span id="list-count">0 所</span></div>
      <input id="school-search" class="search" placeholder="搜索学校、城市、主管部门" />
      <div id="classify-tabs" class="filters classify-tabs"></div>
      <div id="rank-filters" class="filters rank-filters"></div>
      <div id="filters" class="filters"></div>
    </div>
    <div id="school-list" class="list"></div>
    <div id="detail" class="detail"></div>
  </aside>
  <div class="notice" id="notice"></div>
  <div class="summary-panel" id="summary-panel" aria-live="polite"></div>
  <div class="legend">
    <span><i class="dot-key rank985"></i>985</span>
    <span><i class="dot-key rank211"></i>211</span>
    <span><i class="dot-key central"></i>中央部门</span>
    <span><i class="dot-key"></i>地方公办</span>
    <span><i class="dot-key private"></i>民办</span>
    <span><i class="dot-key coop"></i>合作办学</span>
    <span><i class="dot-key conf-low"></i>低置信坐标</span>
  </div>
</div>
<script src="data.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>
(() => {
  const data = window.UNDERGRAD_MAP_DATA;
  const state = { province: "全部", city: "全部", owner: "全部", rank: "全部", groupBy: "none", query: "", provinceQuery: "", selectedId: "", provincePanelOpen: true, schoolPanelOpen: true };
  const els = {
    total: document.getElementById("total-count"),
    provinceCount: document.getElementById("province-count"),
    visible: document.getElementById("visible-count"),
    visitors: document.getElementById("busuanzi_value_site_uv"),
    source: document.getElementById("source-line"),
    notice: document.getElementById("notice"),
    summary: document.getElementById("summary-panel"),
    ownerSelect: document.getElementById("owner-select"),
    provinceSelect: document.getElementById("province-select"),
    citySelect: document.getElementById("city-select"),
    tierSelect: document.getElementById("tier-select"),
    provinceSearch: document.getElementById("province-search"),
    provinceList: document.getElementById("province-list"),
    schoolSearch: document.getElementById("school-search"),
    schoolList: document.getElementById("school-list"),
    listCount: document.getElementById("list-count"),
    classifyTabs: document.getElementById("classify-tabs"),
    filters: document.getElementById("filters"),
    rankFilters: document.getElementById("rank-filters"),
    detail: document.getElementById("detail"),
    fallback: document.getElementById("fallback-map"),
    provincePanel: document.querySelector(".province-panel"),
    schoolPanel: document.querySelector(".school-panel"),
    provinceToggle: document.getElementById("province-panel-toggle"),
    schoolToggle: document.getElementById("school-panel-toggle"),
    selectionChip: document.getElementById("selection-chip"),
    selectionName: document.getElementById("selection-name"),
    clearSelection: document.getElementById("clear-selection")
  };
  const ownerClass = { "中央部门": "central", "地方公办": "", "民办": "private", "合作办学": "coop" };
  const sourceName = { amap: "高德", baidu: "百度", tianditu: "天地图", "province-scatter": "省级散点" };
  const confidenceName = { high: "高置信", medium: "中置信", low: "低置信" };
  const originalSchoolOrder = new Map(data.schools.map((school, index) => [school.id, index]));
  const MAJOR_PROFILES = {};
  let map = null;
  let layer = null;
  let provinceLayer = null;
  const markerById = new Map();

  function init() {
    els.total.textContent = data.meta.total;
    els.provinceCount.textContent = data.provinces.length;
    els.source.textContent = `${data.meta.source}，截至 ${data.meta.asOf}`;
    els.notice.textContent = data.meta.note;
    initResponsiveLayout();
    renderTopSelects();
    renderClassifyTabs();
    renderFilters();
    renderProvinceList();
    renderDetail(null);
    syncPanelVisibility();
    initMap();
    bindEvents();
    initVisitorCount();
    update();
  }

  function initResponsiveLayout() {
    const topbar = document.querySelector(".topbar");
    if (!topbar) return;
    let lastHeight = 0;
    const sync = () => {
      const height = Math.ceil(topbar.getBoundingClientRect().height);
      if (!height || height === lastHeight) return;
      lastHeight = height;
      document.documentElement.style.setProperty("--topbar-height", `${height}px`);
      if (map) window.requestAnimationFrame(() => map.invalidateSize());
    };
    sync();
    if (window.ResizeObserver) {
      new ResizeObserver(sync).observe(topbar);
    } else {
      window.addEventListener("resize", sync);
      window.addEventListener("orientationchange", sync);
    }
  }

  function initVisitorCount() {
    if (!els.visitors) return;
    const fallback = () => {
      const current = els.visitors.textContent.trim();
      if (current && current !== "...") return;
      const key = "undergrad-map-visitor-id";
      try {
        if (!localStorage.getItem(key)) {
          localStorage.setItem(key, `${Date.now()}-${Math.random().toString(36).slice(2)}`);
        }
        els.visitors.textContent = "1";
      } catch (error) {
        els.visitors.textContent = "1";
      }
    };
    window.setTimeout(fallback, 2500);
  }

  function initMap() {
    if (window.L) {
      map = L.map("map", { zoomControl: false, attributionControl: false }).setView([34.7, 104.8], 4);
      L.control.zoom({ position: "bottomleft" }).addTo(map);
      L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
        subdomains: "1234",
        maxZoom: 18,
        maxNativeZoom: 18
      }).addTo(map);
      L.control.attribution({ prefix: "" }).addTo(map).addAttribution("高德地图");
      layer = L.layerGroup().addTo(map);
      provinceLayer = L.layerGroup().addTo(map);
    } else {
      els.fallback.classList.add("active");
    }
  }

  function bindEvents() {
    els.ownerSelect.addEventListener("change", () => {
      state.owner = els.ownerSelect.value;
      clearSelection(false);
      update();
    });
    els.provinceSelect.addEventListener("change", () => {
      state.province = els.provinceSelect.value;
      state.city = "全部";
      clearSelection(false);
      renderTopSelects();
      update();
      const province = data.provinces.find(p => p.name === state.province);
      if (map && province) map.setView([province.center[1], province.center[0]], 6);
      if (map && state.province === "全部") map.setView([34.7, 104.8], 4);
    });
    els.citySelect.addEventListener("change", () => {
      state.city = els.citySelect.value;
      clearSelection(false);
      update();
      focusCurrentCity();
    });
    els.tierSelect.addEventListener("change", () => {
      state.rank = els.tierSelect.value;
      clearSelection(false);
      update();
    });
    els.schoolSearch.addEventListener("input", e => { state.query = e.target.value.trim(); update(); });
    els.provinceSearch.addEventListener("input", e => { state.provinceQuery = e.target.value.trim(); renderProvinceList(); });
    if (els.clearSelection) els.clearSelection.addEventListener("click", clearSelection);
    els.provinceToggle.addEventListener("click", () => {
      if (state.selectedId) clearSelection(false);
      state.provincePanelOpen = !state.provincePanelOpen;
      syncPanelVisibility();
    });
    els.schoolToggle.addEventListener("click", () => {
      if (state.selectedId) clearSelection(false);
      state.schoolPanelOpen = !state.schoolPanelOpen;
      syncPanelVisibility();
    });
  }

  function renderTopSelects() {
    renderSelect(els.ownerSelect, [["全部", "全部"], ...data.owners.map(owner => [owner, owner])], state.owner);
    renderSelect(els.provinceSelect, [["全部", "全国"], ...data.provinces.map(p => [p.name, p.name])], state.province);
    renderSelect(els.citySelect, cityOptions(), state.city);
    renderSelect(els.tierSelect, [
      ["全部", "全部"],
      ["985", "985"],
      ["211", "211"],
      ["普通本科", "普通本科"],
      ["一本", "一本（暂无批次数据）"],
      ["二本", "二本（暂无批次数据）"]
    ], state.rank);
  }

  function renderSelect(select, options, value) {
    select.innerHTML = options.map(([optionValue, label]) => `<option value="${optionValue}">${label}</option>`).join("");
    select.value = options.some(([optionValue]) => optionValue === value) ? value : "全部";
  }

  function cityOptions() {
    if (state.province === "全部") return [["全部", "全部城市"]];
    return [["全部", "全部城市"], ...provinceCityCounts(state.province).map(([city, count]) => [city, `${city}（${count}）`])];
  }

  function renderFilters() {
    const all = ["全部", ...data.owners];
    els.filters.innerHTML = all.map(owner => `<button class="filter-btn${owner === state.owner ? " active" : ""}" data-owner="${owner}">${owner}</button>`).join("");
    els.filters.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        state.owner = btn.dataset.owner;
        renderFilters();
        update();
      });
    });
    const ranks = data.ranks || ["全部", "985", "211", "普通本科"];
    els.rankFilters.innerHTML = ranks.map(rank => `<button class="filter-btn${rank === state.rank ? " active" : ""}" data-rank="${rank}">${rank}</button>`).join("");
    els.rankFilters.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        state.rank = btn.dataset.rank;
        renderFilters();
        update();
      });
    });
  }

  function renderClassifyTabs() {
    const modes = [
      ["none", "列表"],
      ["ownership", "性质"],
      ["region", "地区"],
      ["tier", "层次"]
    ];
    els.classifyTabs.innerHTML = modes.map(([mode, label]) => `<button class="filter-btn${mode === state.groupBy ? " active" : ""}" data-group="${mode}">${label}</button>`).join("");
    els.classifyTabs.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        state.groupBy = btn.dataset.group;
        renderClassifyTabs();
        renderSchoolList(filteredSchools());
      });
    });
  }

  function renderProvinceList() {
    const query = state.provinceQuery;
    const items = data.provinces.filter(p => provinceMatchesQuery(p, query));
    els.provinceList.innerHTML = [
      `<div class="province-group"><button class="province-item${state.province === "全部" ? " active" : ""}" data-province="全部"><span class="province-name">全国</span><span class="count-pill">${data.meta.total}</span><span class="province-meta">全部本科院校</span></button></div>`,
      ...items.map(p => {
        const cities = p.topCities.map(([city, count]) => `${city}${count}`).join(" / ");
        const cityRows = provinceCityCounts(p.name)
          .filter(([city]) => !query || p.name.includes(query) || p.shortName.includes(query) || city.includes(query))
          .map(([city, count]) => `<button class="city-item${state.province === p.name && state.city === city ? " active" : ""}" data-province="${p.name}" data-city="${city}"><span>${city}</span><span class="city-count">${count}</span></button>`)
          .join("");
        const expanded = state.province === p.name || Boolean(query);
        return `<div class="province-group"><button class="province-item${state.province === p.name && state.city === "全部" ? " active" : ""}" data-province="${p.name}"><span class="province-name">${p.name}</span><span class="count-pill">${p.count}</span><span class="province-meta">${cities}</span></button><div class="city-list${expanded ? "" : " collapsed"}">${cityRows}</div></div>`;
      })
    ].join("");
    els.provinceList.querySelectorAll(".province-item").forEach(btn => {
      btn.addEventListener("click", () => {
        state.province = btn.dataset.province;
        state.city = "全部";
        clearSelection(false);
        renderProvinceList();
        update();
        const province = data.provinces.find(p => p.name === state.province);
        if (map && province) map.setView([province.center[1], province.center[0]], 6);
        if (map && state.province === "全部") map.setView([34.7, 104.8], 4);
      });
    });
    els.provinceList.querySelectorAll(".city-item").forEach(btn => {
      btn.addEventListener("click", () => {
        state.province = btn.dataset.province;
        state.city = btn.dataset.city;
        clearSelection(false);
        renderProvinceList();
        update();
        focusCurrentCity();
      });
    });
  }

  function provinceCityCounts(provinceName) {
    const counts = new Map();
    data.schools.filter(s => s.province === provinceName).forEach(s => counts.set(s.city, (counts.get(s.city) || 0) + 1));
    return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh-CN"));
  }

  function provinceMatchesQuery(p, query) {
    if (!query) return true;
    if (p.name.includes(query) || p.shortName.includes(query)) return true;
    return provinceCityCounts(p.name).some(([city]) => city.includes(query));
  }

  function filteredSchools(options = {}) {
    const exclude = options.exclude || null;
    const query = state.query.toLowerCase();
    return data.schools.filter(s => {
      const provinceOk = state.province === "全部" || s.province === state.province;
      const cityOk = state.city === "全部" || s.city === state.city;
      const ownerOk = exclude === "owner" || state.owner === "全部" || s.ownership === state.owner;
      const rankOk = exclude === "rank" || state.rank === "全部" || s.rank === state.rank || (state.rank === "211" && s.tags && s.tags.includes("211"));
      const hay = `${s.name} ${s.city} ${s.province} ${s.department} ${s.remark} ${s.rank} ${(s.tags || []).join(" ")}`.toLowerCase();
      const queryOk = !query || hay.includes(query);
      return provinceOk && cityOk && ownerOk && rankOk && queryOk;
    }).sort(compareSchoolsForView);
  }

  function rankPriority(s) {
    const tags = s.tags || [];
    if (s.rank === "985" || tags.includes("985")) return 0;
    if (s.rank === "211" || tags.includes("211")) return 1;
    return 2;
  }

  function compareSchoolsForView(a, b) {
    const originalDiff = (originalSchoolOrder.get(a.id) ?? 0) - (originalSchoolOrder.get(b.id) ?? 0);
    const scopedToPlace = state.province !== "全部" || state.city !== "全部";
    if (!scopedToPlace && (a.province !== b.province || a.city !== b.city)) return originalDiff;
    const rankDiff = rankPriority(a) - rankPriority(b);
    return rankDiff || originalDiff;
  }

  function update() {
    const schools = filteredSchools();
    els.notice.textContent = ["一本", "二本"].includes(state.rank)
      ? "当前教育部高校名单数据未包含一本/二本招生批次字段，暂不能精确筛选该层次。"
      : data.meta.note;
    els.visible.textContent = schools.length;
    els.listCount.textContent = `${schools.length} 所`;
    renderSummary(schools);
    renderSchoolList(schools);
    renderMap(schools);
  }

  function renderSummary(schools) {
    els.summary.innerHTML = `
      <div class="summary-title">
        <div class="summary-title-main"><b>当前筛选汇总</b><span>${schools.length}</span></div>
        <button class="summary-clear" id="summary-clear" type="button">清除选择</button>
      </div>
      <div class="summary-filter">${filterSummaryText()}</div>
      <div class="summary-grid">
        ${summaryBlock("办学性质", countBy(filteredSchools({ exclude: "owner" }), s => s.ownership || "未标注性质"), "owner")}
        ${summaryBlock("学校层次", countBy(filteredSchools({ exclude: "rank" }), tierName), "tier")}
      </div>`;
    const clearBtn = els.summary.querySelector("#summary-clear");
    if (clearBtn) clearBtn.addEventListener("click", clearSummarySelection);
    els.summary.querySelectorAll(".summary-tag.filterable").forEach(tag => {
      tag.addEventListener("click", () => applySummaryFilter(tag.dataset.facet, tag.dataset.value));
      tag.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        applySummaryFilter(tag.dataset.facet, tag.dataset.value);
      });
    });
  }

  function filterSummaryText() {
    const parts = [
      `省份：${state.province === "全部" ? "全国" : state.province}`,
      `城市：${state.city === "全部" ? "全部城市" : state.city}`,
      `办学性质：${state.owner}`,
      `学校层次：${state.rank}`
    ];
    return parts.join(" / ");
  }

  function countBy(items, getName) {
    const counts = new Map();
    items.forEach(item => {
      const name = getName(item);
      counts.set(name, (counts.get(name) || 0) + 1);
    });
    return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh-CN"));
  }

  function summaryBlock(title, counts, className) {
    const visible = counts.slice(0, 8);
    const tags = visible.length
      ? visible.map(([name, count]) => {
        const active = isSummaryTagActive(className, name) ? " active" : "";
        return `<span class="summary-tag ${className} filterable${active}" role="button" tabindex="0" data-facet="${escapeAttr(className)}" data-value="${escapeAttr(name)}">${escapeHtml(name)}<b>${count}</b></span>`;
      }).join("")
      : `<span class="summary-tag ${className}">暂无数据<b>0</b></span>`;
    const more = counts.length > visible.length ? `<span class="summary-tag">+${counts.length - visible.length}</span>` : "";
    return `<div class="summary-block"><h3>${title}</h3><div class="summary-tags">${tags}${more}</div></div>`;
  }

  function isSummaryTagActive(facet, value) {
    if (facet === "owner") return state.owner === value;
    if (facet === "tier") return state.rank === tierValueFromName(value);
    return false;
  }

  function tierValueFromName(name) {
    if (name === "985 高校") return "985";
    if (name === "211 高校") return "211";
    return "普通本科";
  }

  function applySummaryFilter(facet, value) {
    if (facet === "owner") {
      state.owner = state.owner === value ? "全部" : value;
    } else if (facet === "tier") {
      const nextRank = tierValueFromName(value);
      state.rank = state.rank === nextRank ? "全部" : nextRank;
    }
    clearSelection(false);
    renderTopSelects();
    renderFilters();
    renderDetail(null);
    update();
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function escapeAttr(value) {
    return escapeHtml(value).replace(/"/g, "&quot;");
  }

  function clearSummarySelection() {
    state.province = "全部";
    state.city = "全部";
    state.owner = "全部";
    state.rank = "全部";
    state.groupBy = "none";
    state.query = "";
    state.provinceQuery = "";
    clearSelection(false);
    if (els.schoolSearch) els.schoolSearch.value = "";
    if (els.provinceSearch) els.provinceSearch.value = "";
    renderTopSelects();
    renderClassifyTabs();
    renderFilters();
    renderProvinceList();
    renderDetail(null);
    update();
    if (map) map.setView([34.7, 104.8], 4);
  }

  function renderMap(schools) {
    markerById.clear();
    if (map) {
      layer.clearLayers();
      provinceLayer.clearLayers();
      const provinceVisible = state.province === "全部" && state.city === "全部" && !state.query && state.owner === "全部" && state.rank === "全部";
      if (provinceVisible) {
        data.provinces.forEach(p => {
          const size = Math.max(34, Math.min(62, 24 + p.count * .48));
          const icon = L.divIcon({ className: "", html: `<div class="province-pin" style="width:${size}px;height:${size}px">${p.count}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
          L.marker([p.center[1], p.center[0]], { icon }).addTo(provinceLayer).bindTooltip(p.name).on("click", () => {
            state.province = p.name;
            state.city = "全部";
            clearSelection(false);
            renderProvinceList();
            update();
            map.setView([p.center[1], p.center[0]], 6);
          });
        });
      }
      schools.forEach(s => {
        const cls = markerClass(s);
        const size = s.rank === "985" ? 34 : s.rank === "211" ? 30 : 26;
        const icon = L.divIcon({ className: "", html: `<div class="school-dot ${cls}"></div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
        const marker = L.marker([s.point[1], s.point[0]], { icon }).addTo(layer).bindPopup(popupHtml(s));
        marker.on("click", () => selectSchool(s.id, false));
        markerById.set(s.id, marker);
      });
      if (schools.length && state.province !== "全部") {
        const bounds = L.latLngBounds(schools.map(s => [s.point[1], s.point[0]]));
        map.fitBounds(bounds.pad(.2), { maxZoom: state.city === "全部" ? 12 : 13 });
      }
    } else {
      renderFallback(schools);
    }
  }

  function renderFallback(schools) {
    const minLng = 73, maxLng = 135, minLat = 18, maxLat = 54;
    els.fallback.innerHTML = schools.map(s => {
      const x = ((s.point[0] - minLng) / (maxLng - minLng)) * 100;
      const y = (1 - (s.point[1] - minLat) / (maxLat - minLat)) * 100;
      const cls = markerClass(s);
      const size = s.rank === "985" ? 34 : s.rank === "211" ? 30 : 26;
      return `<button class="fallback-point ${cls}" data-id="${s.id}" style="left:${x}%;top:${y}%;width:${size}px;height:${size}px;background:${colorFor(s)}" title="${s.name}"></button>`;
    }).join("");
    els.fallback.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        const school = data.schools.find(s => s.id === btn.dataset.id);
        selectSchool(school.id, true);
      });
    });
  }

  function colorFor(owner) {
    if (typeof owner === "object") {
      if (owner.rank === "985") return "#ea580c";
      if (owner.rank === "211") return "#10b981";
      owner = owner.ownership;
    }
    return owner === "中央部门" ? "#2563eb" : owner === "民办" ? "#ea580c" : owner === "合作办学" ? "#7c3aed" : "#3b82f6";
  }

  function markerClass(s) {
      const owner = ownerClass[s.ownership] || "";
      const rank = s.rank === "985" ? "rank985" : s.rank === "211" ? "rank211" : "";
      const conf = s.coordinateConfidence === "low" ? "conf-low" : s.coordinateConfidence === "medium" ? "conf-medium" : "";
    return `${owner} ${rank} ${conf}`.trim();
  }

  function renderSchoolList(schools) {
    const limit = 260;
    const view = schools.slice(0, limit);
    const more = schools.length > view.length ? `<div class="school-meta" style="padding:8px 14px">已显示前 ${view.length} 所，可继续搜索缩小范围。</div>` : "";
    els.schoolList.innerHTML = state.groupBy === "none"
      ? view.map(s => schoolItemHtml(s)).join("") + more
      : groupedSchoolListHtml(schools, limit) + more;
    els.schoolList.querySelectorAll(".school-item").forEach(btn => {
      btn.addEventListener("click", () => selectSchool(btn.dataset.id, true));
    });
  }

  function groupedSchoolListHtml(schools, limit) {
    let rendered = 0;
    return groupedSchools(schools).map(group => {
      const remaining = Math.max(0, limit - rendered);
      const visibleSchools = group.schools.slice(0, remaining);
      rendered += visibleSchools.length;
      if (!visibleSchools.length) return "";
      const items = visibleSchools.map(s => schoolItemHtml(s)).join("");
      return `<div class="school-group"><div class="group-heading"><span>${group.name}</span><span>${group.schools.length} 所</span></div>${items}</div>`;
    }).join("");
  }

  function groupedSchools(schools) {
    const groups = new Map();
    schools.forEach(s => {
      const name = groupNameForSchool(s);
      if (!groups.has(name)) groups.set(name, []);
      groups.get(name).push(s);
    });
    return [...groups.entries()]
      .map(([name, groupSchools]) => ({ name, schools: groupSchools }))
      .sort((a, b) => groupOrder(a.name) - groupOrder(b.name) || a.name.localeCompare(b.name, "zh-CN"));
  }

  function groupOrder(name) {
    const tierIndex = ["985 高校", "211 高校", "普通本科（一本/二本未细分）"].indexOf(name);
    const ownerIndex = ["中央部门", "地方公办", "民办", "合作办学"].indexOf(name);
    if (state.groupBy === "tier") return tierIndex === -1 ? 99 : tierIndex;
    if (state.groupBy === "ownership") return ownerIndex === -1 ? 99 : ownerIndex;
    return 0;
  }

  function groupNameForSchool(s) {
    if (state.groupBy === "ownership") return s.ownership || "未标注性质";
    if (state.groupBy === "region") return state.province === "全部" ? s.province : s.city;
    if (state.groupBy === "tier") return tierName(s);
    return "全部";
  }

  function tierName(s) {
    const tags = s.tags || [];
    if (s.rank === "985" || tags.includes("985")) return "985 高校";
    if (s.rank === "211" || tags.includes("211")) return "211 高校";
    return "普通本科（一本/二本未细分）";
  }

  function schoolItemHtml(s) {
    const cls = markerClass(s);
    const badges = (s.tags || []).map(tag => `<span class="badge ${tag === "985" ? "rank985" : "rank211"}">${tag}</span>`).join("");
    return `<button class="school-item${state.selectedId === s.id ? " active" : ""}" data-id="${s.id}">
      <span class="school-name"><i class="dot-key ${cls}"></i>${s.name}<span class="school-badges">${badges}</span></span>
      <span class="school-meta">${tierName(s)} · ${s.province} · ${s.city} · ${s.ownership} · ${confidenceName[s.coordinateConfidence] || "未校准"} · ${sourceName[s.coordinateSource] || s.coordinateSource || "未知"}${s.remark ? " · " + s.remark : ""}</span>
    </button>`;
  }

  function selectSchool(id, moveMap) {
    const school = data.schools.find(s => s.id === id);
    if (!school) return;
    state.selectedId = id;
    renderDetail(school);
    syncPanelVisibility();
    document.querySelectorAll(".school-item").forEach(item => item.classList.toggle("active", item.dataset.id === id));
    if (map && moveMap) {
      map.setView([school.point[1], school.point[0]], 15);
      const marker = markerById.get(id);
      if (marker) marker.openPopup();
    }
  }

  function clearSelection(closePopup = true) {
    state.selectedId = "";
    renderDetail(null);
    document.querySelectorAll(".school-item").forEach(item => item.classList.remove("active"));
    if (map && closePopup) map.closePopup();
    syncPanelVisibility();
  }

  function syncPanelVisibility() {
    const selected = Boolean(state.selectedId);
    els.provincePanel.classList.toggle("collapsed", selected || !state.provincePanelOpen);
    els.schoolPanel.classList.toggle("collapsed", selected || !state.schoolPanelOpen);
    els.provinceToggle.classList.toggle("active", state.provincePanelOpen && !selected);
    els.schoolToggle.classList.toggle("active", state.schoolPanelOpen && !selected);
    els.provinceToggle.setAttribute("aria-pressed", String(state.provincePanelOpen && !selected));
    els.schoolToggle.setAttribute("aria-pressed", String(state.schoolPanelOpen && !selected));
    if (els.selectionChip) els.selectionChip.classList.remove("active");
    if (els.selectionName) els.selectionName.textContent = "";
  }

  function focusCurrentCity() {
    if (!map || state.city === "全部") return;
    const schools = data.schools.filter(s => s.province === state.province && s.city === state.city);
    if (!schools.length) return;
    const bounds = L.latLngBounds(schools.map(s => [s.point[1], s.point[0]]));
    map.fitBounds(bounds.pad(.25), { maxZoom: 13 });
  }

  function renderDetail(s) {
    if (!s) {
      els.detail.innerHTML = `<h2>选择一所学校</h2><p>在地图或右侧列表中点击学校，可查看标识码、主管部门、所在地、坐标置信度和重点专业排名。</p><p>数据口径为教育部截至 ${data.meta.asOf} 的全国普通高校名单。</p>`;
      return;
    }
    const tagText = s.tags && s.tags.length ? s.tags.join(" / ") : "普通本科";
    const source = sourceName[s.coordinateSource] || s.coordinateSource || "未知";
    const candidate = s.coordinateCandidate ? `；候选：${s.coordinateCandidate.name}${s.coordinateCandidate.address ? "（" + s.coordinateCandidate.address + "）" : ""}` : "";
    els.detail.innerHTML = `<h2>${s.name}</h2><p>重点标记：${tagText}</p><p>坐标置信度：${confidenceName[s.coordinateConfidence] || "未校准"}；来源：${source}；评分：${s.coordinateScore || 0}${candidate}</p><p>学校标识码：${s.id}</p><p>所在地：${s.province} ${s.city}</p><p>主管部门：${s.department}</p><p>类型：${s.ownership}${s.remark ? "；备注：" + s.remark : ""}</p>${majorHtml(s)}`;
  }

  function majorHtml(s) {
    const majors = sortedMajors(s);
    if (!majors.length) {
      return `<div class="major-block"><h3>专业与优势排名</h3><p>暂无已接入的专业数据。</p></div>`;
    }
    const rows = majors.map(([name, rank, source], index) => `<div class="major-row"><span class="major-index">${index + 1}</span><span class="major-name" title="${name}">${name}</span><span class="major-rank">${rank}</span><span class="major-source">${source}</span></div>`).join("");
    return `<div class="major-block"><h3>专业与优势排名</h3><div class="major-list">${rows}</div></div>`;
  }

  function popupHtml(s) {
    const tagText = s.tags && s.tags.length ? ` · ${s.tags.join("/")}` : "";
    return `<div class="popup-title">${s.name}${tagText}</div><div class="popup-line">${s.province} ${s.city}</div><div class="popup-line">${s.department} · ${s.ownership}</div><div class="popup-line">${confidenceName[s.coordinateConfidence] || "未校准"} · ${sourceName[s.coordinateSource] || s.coordinateSource || "未知"} · 评分 ${s.coordinateScore || 0}</div><div class="popup-line">标识码：${s.id}</div>${popupMajorHtml(s)}`;
  }

  function popupMajorHtml(s) {
    const majors = sortedMajors(s);
    if (!majors.length) {
      return `<div class="popup-majors"><div class="popup-major-title">专业排名</div><div class="popup-line">暂无已接入专业数据</div></div>`;
    }
    const tags = majors.slice(0, 5).map(([name, rank]) => `<span class="popup-major-tag" title="${name}">${name}<b>${rank}</b></span>`).join("");
    const more = majors.length > 5 ? `<span class="popup-major-tag">+${majors.length - 5}</span>` : "";
    return `<div class="popup-majors"><div class="popup-major-title">专业排名</div><div class="popup-major-tags">${tags}${more}</div></div>`;
  }

  function sortedMajors(s) {
    return [...(s.majors || MAJOR_PROFILES[s.name] || [])].sort((a, b) =>
      majorRankScore(a[1]) - majorRankScore(b[1]) || a[0].localeCompare(b[0], "zh-CN")
    );
  }

  function majorRankScore(rank) {
    const order = {
      "A+": 0,
      "A": 1,
      "A-": 2,
      "B+": 3,
      "B": 4,
      "B-": 5,
      "C+": 6,
      "C": 7,
      "C-": 8,
    };
    return order[String(rank || "").trim()] ?? 99;
  }

  init();
})();
</script>
</body>
</html>
